<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" fill="none">
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#fbe2bd"/></linearGradient>
 <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#67ded2"/><stop offset="1" stop-color="#219d99"/></linearGradient>
 <linearGradient id="amber" x2="1" y2="1"><stop stop-color="#ffd991"/><stop offset="1" stop-color="#eeb36d"/></linearGradient>
 <filter id="depth" x="-40%" y="-40%" width="190%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#9b6844" flood-opacity=".23"/></filter>
<linearGradient id="filing-flow-colors" x1="0%" y1="50%" x2="100%" y2="50%" color-interpolation="sRGB"><stop stop-color="#EEB36D"/><stop offset="1" stop-color="#219D99"/></linearGradient>
</defs>
<!-- Continuous flow starts beneath the document and finishes beneath the check tile. -->
<path class="filing-flow-line"
  d="M900 580 C963 595 1027 602 1065 568 C1092 541 1122 545 1148 571 C1174 597 1202 607 1233 595 C1264 583 1300 565 1358 573"
  pathLength="100" fill="none" stroke="url(#filing-flow-colors)" stroke-width="3"
  stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
<!-- Recording-style pulsing dot follows the leading tip on the existing timeline. -->
<g class="filing-flow-dot" pointer-events="none">
  <g>
    <circle r="7" fill="#EEB36D" opacity=".2">
      <animate attributeName="fill" values="#EEB36D;#219D99;#219D99" keyTimes="0;0.5;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;10;5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.06;.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#EEB36D">
      <animate attributeName="fill" values="#EEB36D;#219D99;#219D99" keyTimes="0;0.5;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <animateMotion path="M900 580 C963 595 1027 602 1065 568 C1092 541 1122 545 1148 571 C1174 597 1202 607 1233 595 C1264 583 1300 565 1358 573" dur="14s" repeatCount="indefinite"
      calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.5;1"/>
  </g>
  <animate attributeName="opacity" values="0.95;0;0" keyTimes="0;0.5;1"
    calcMode="discrete" dur="14s" repeatCount="indefinite"/>
</g>


<!-- Exposed top-right status checklist; two offset sheets provide depth. -->
<g transform="translate(1290 -12) rotate(10 65 65)" filter="url(#depth)">
 <rect x="9" y="12" width="134" height="152" rx="18" fill="#dfb48b"/>
 <rect x="4" y="5" width="134" height="152" rx="18" fill="#ffe0af" stroke="#fff7e9"/>
 <rect width="134" height="152" rx="18" fill="url(#paper)" stroke="white" stroke-width="2"/>
 <rect x="19" y="17" width="96" height="9" rx="4" fill="#d6a779"/>
 <g fill="url(#teal)"><rect x="17" y="42" width="25" height="25" rx="7"/><rect x="17" y="80" width="25" height="25" rx="7"/></g>
 <path d="m23 54 5 5 8-10m-13 43 5 5 8-10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="17" y="117" width="25" height="21" rx="6" fill="url(#amber)"/>
 <g stroke="#c2ab8f" stroke-width="5" stroke-linecap="round"><path d="M53 49h57m-57 12h40m-40 26h57m-57 12h36m-36 26h57"/></g>
</g>
<!-- Monthly filing tiles at the bottom edge. -->
<g transform="translate(753 543) rotate(-10 80 45)" filter="url(#depth)">
 <rect x="7" y="8" width="168" height="85" rx="15" fill="#d7a87b"/>
 <rect width="168" height="85" rx="15" fill="url(#paper)" stroke="white" stroke-width="2"/>
 <path d="M18 21h84" stroke="#bd9874" stroke-width="6" stroke-linecap="round"/>
 <g fill="url(#teal)"><rect x="17" y="39" width="32" height="29" rx="7"/><rect x="60" y="39" width="32" height="29" rx="7"/></g>
 <rect x="103" y="39" width="46" height="29" rx="7" fill="url(#amber)"/>
 <path d="m25 53 5 5 10-11m28 6 5 5 10-11" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g transform="translate(1326 541)" filter="url(#depth)"><rect x="4" y="7" width="64" height="64" rx="19" fill="#168883"/><rect width="64" height="64" rx="19" fill="url(#teal)" stroke="#c4fff2" stroke-width="2"/><path d="m17 32 11 11 21-23" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Quiet dealer rows and timeline behind the screenshot on the left. -->
<g transform="translate(32 80) rotate(-12)" opacity=".28"><rect x="8" y="10" width="179" height="163" rx="18" fill="#d7a372"/><rect width="179" height="163" rx="18" fill="url(#paper)" stroke="white" stroke-width="2"/><path d="M25 32h125M25 64h88M25 97h88M25 130h88" stroke="#c49e78" stroke-width="6" stroke-linecap="round"/><g fill="#35b5ab"><circle cx="145" cy="64" r="9"/><circle cx="145" cy="97" r="9"/></g><circle cx="145" cy="130" r="9" fill="#e2af64"/></g>
<g transform="translate(552 225)" opacity=".18"><rect width="118" height="120" rx="18" fill="url(#teal)"/><path d="M24 33h70M24 59h48M24 85h62" stroke="white" stroke-width="6" stroke-linecap="round"/></g>
<style>
  .filing-flow-line {
    /* A full-path gap lets the entire stroke exit before the next one enters. */
    stroke-dasharray: 100 100;
    stroke-dashoffset: 100;
    opacity: .9;
    animation: filingContinuousFlow 14s linear infinite;
  }
  @keyframes filingContinuousFlow {
    from { stroke-dashoffset: 100; }
    to { stroke-dashoffset: -100; }
  }
  @media (prefers-reduced-motion: reduce) {
    .filing-flow-line { animation: none; stroke-dasharray: none; }
    .filing-flow-dot { display: none; }
  }
</style>
</svg>
