<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" fill="none">
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0FFF9"/></linearGradient>
 <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#85D8BA"/><stop offset="1" stop-color="#168C89"/></linearGradient>
 <linearGradient id="amber" x2="1" y2="1"><stop stop-color="#BBF1D4"/><stop offset="1" stop-color="#5DC7BB"/></linearGradient>
 <filter id="depth" x="-40%" y="-40%" width="190%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#327E71" flood-opacity=".23"/></filter>
<linearGradient id="filing-flow-colors" x1="0%" y1="50%" x2="100%" y2="50%" color-interpolation="sRGB"><stop stop-color="#168C89"/><stop offset="1" stop-color="#168C89"/></linearGradient>
</defs>
<!-- Continuous flow starts beneath the document and finishes beneath the check tile. -->
<path class="filing-flow-line"
  d="M187 580 C360 610 460 541 620 577 S870 608 1020 575 S1230 550 1358 573"
  pathLength="100" fill="none" stroke="url(#filing-flow-colors)" stroke-width="3"
  stroke-linecap="round" stroke-linejoin="round" pointer-events="none" stroke-dashoffset="100">
  <!-- Use the SVG document clock shared by the dot, including after tab suspension. -->
  <animate attributeName="stroke-dashoffset" values="100;-100" begin="0s"
    dur="14s" calcMode="linear" repeatCount="indefinite"/>
</path>
<!-- Recording-style pulsing dot follows the leading tip on the existing timeline. -->
<g class="filing-flow-dot" pointer-events="none">
  <g>
    <circle r="7" fill="#168C89" opacity=".2">
      <animate attributeName="fill" values="#168C89;#168C89;#168C89" keyTimes="0;0.5;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;10;5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.06;.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#168C89">
      <animate attributeName="fill" values="#168C89;#168C89;#168C89" keyTimes="0;0.5;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <animateMotion begin="0s" path="M187 580 C360 610 460 541 620 577 S870 608 1020 575 S1230 550 1358 573" dur="14s" repeatCount="indefinite"
      calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.5;1"/>
  </g>
  <animate attributeName="opacity" values="0.95;0;0" keyTimes="0;0.5;1"
    calcMode="discrete" dur="14s" repeatCount="indefinite"/>
</g>


<!-- Status clock and completion card. -->
<g transform="translate(1328 42)" filter="url(#depth)">
<circle cx="0" cy="9" r="61" fill="#61B7AE"/><circle r="61" fill="#F5FFFC" stroke="#BCEBDD" stroke-width="3"/>
<circle r="44" stroke="#C7EEE2" stroke-width="7"/><path d="M0-44A44 44 0 1 1-42 13" stroke="#168C89" stroke-width="7" stroke-linecap="round"/>
<path d="M0-24V0l19 13" stroke="#168C89" stroke-width="5" stroke-linecap="round"/>
</g>
<g transform="translate(35 535) rotate(-8 88 43)" filter="url(#depth)">
<rect x="7" y="8" width="177" height="88" rx="15" fill="#65B6A9"/>
<rect width="177" height="88" rx="15" fill="#F5FFFC" stroke="white" stroke-width="2"/>
<circle cx="34" cy="43" r="21" fill="#168C89"/><path d="m24 43 7 7 14-16" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="39" fill="#0B3B3B" font-family="Arial,sans-serif" font-size="14" font-weight="700">FILED</text>
<path d="M66 54h83M66 65h56" stroke="#9ECABC" stroke-width="4" stroke-linecap="round"/>
</g>
<g transform="translate(1326 541)" filter="url(#depth)"><rect x="4" y="7" width="64" height="64" rx="19" fill="#167F7C"/><rect width="64" height="64" rx="19" fill="url(#teal)" stroke="#E7FFF5" stroke-width="2"/><path d="m17 32 11 11 21-23" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Quiet dealer rows and timeline behind the screenshot on the left. -->
<g transform="translate(32 80) rotate(-12)" opacity=".28"><rect x="8" y="10" width="179" height="163" rx="18" fill="#72B9A8"/><rect width="179" height="163" rx="18" fill="url(#paper)" stroke="white" stroke-width="2"/><path d="M25 32h125M25 64h88M25 97h88M25 130h88" stroke="#82B5A5" stroke-width="6" stroke-linecap="round"/><g fill="#389F95"><circle cx="145" cy="64" r="9"/><circle cx="145" cy="97" r="9"/></g><circle cx="145" cy="130" r="9" fill="#5DC7BB"/></g>
<g transform="translate(552 225)" opacity=".18"><rect width="118" height="120" rx="18" fill="url(#teal)"/><path d="M24 33h70M24 59h48M24 85h62" stroke="white" stroke-width="6" stroke-linecap="round"/></g>
<style>
  .filing-flow-line {
    /* A full-path gap lets the entire stroke exit before the next one enters. */
    stroke-dasharray: 100 100;
    opacity: .9;
  }
  @media (prefers-reduced-motion: reduce) {
    .filing-flow-line { animation: none; stroke-dasharray: none; }
    .filing-flow-dot { display: none; }
  }
</style>
</svg>
