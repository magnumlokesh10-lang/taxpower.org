<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" fill="none">
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F8FF"/></linearGradient>
<linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFEFA6"/><stop offset="1" stop-color="#E7BB54"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9DDFFF"/><stop offset="1" stop-color="#438BC4"/></linearGradient>
<filter id="depth" x="-45%" y="-45%" width="190%" height="195%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#387B96" flood-opacity=".23"/></filter>
<linearGradient id="reports-flow-colors"><stop stop-color="#438BC4"/><stop offset="1" stop-color="#438BC4"/></linearGradient>
</defs>
<!-- Continuous flow starts beneath the document and finishes beneath the check tile. -->
<path class="reports-flow-line"
  d="M105 585 C230 610 340 535 480 576 S720 609 850 577 S1120 546 1280 578"
  pathLength="100" fill="none" stroke="url(#reports-flow-colors)" stroke-width="3"
  stroke-linecap="round" stroke-linejoin="round" pointer-events="none" stroke-dashoffset="100">
  <!-- Use the SVG document clock shared by the dot, including after tab suspension. -->
  <animate attributeName="stroke-dashoffset" values="100;-100" begin="0s"
    dur="14s" calcMode="linear" repeatCount="indefinite"/>
</path>
<!-- Recording-style pulsing dot follows the leading tip on the existing timeline. -->
<g class="reports-flow-dot" pointer-events="none">
  <g>
    <circle r="7" fill="#438BC4" opacity=".2">
      <animate attributeName="fill" values="#438BC4;#438BC4;#438BC4" keyTimes="0;0.5;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;10;5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.06;.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#438BC4">
      <animate attributeName="fill" values="#438BC4;#438BC4;#438BC4" keyTimes="0;0.5;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <animateMotion begin="0s" path="M105 585 C230 610 340 535 480 576 S720 609 850 577 S1120 546 1280 578" dur="14s" repeatCount="indefinite"
      calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.5;1"/>
  </g>
  <animate attributeName="opacity" values="0.95;0;0" keyTimes="0;0.5;1"
    calcMode="discrete" dur="14s" repeatCount="indefinite"/>
</g>


<!-- Main report motifs occupy the exposed top-left and bottom desktop edges. -->
<g transform="translate(-38 -29) rotate(-12 75 75)" filter="url(#depth)">
<rect x="10" y="12" width="152" height="164" rx="19" fill="#91B4D2"/>
<rect width="152" height="164" rx="19" fill="url(#paper)" stroke="white" stroke-width="2"/>
<path d="M23 29H99M23 46H73" stroke="#72AFC3" stroke-width="6" stroke-linecap="round"/>
<path d="M22 131H132M22 101H132M22 71H132" stroke="#BDDDE8" stroke-width="1.5"/>
<rect x="30" y="99" width="21" height="32" rx="5" fill="url(#aqua)"/>
<rect x="65" y="83" width="21" height="48" rx="5" fill="url(#sky)"/>
<rect x="100" y="61" width="21" height="70" rx="5" fill="url(#aqua)"/>
</g>
<g transform="translate(1250 530) rotate(10 85 65)" filter="url(#depth)">
<rect x="18" y="9" width="159" height="112" rx="15" fill="#72B3D2"/>
<rect x="9" width="159" height="112" rx="15" fill="#BBE7F7" stroke="white"/>
<rect y="-9" width="159" height="112" rx="15" fill="url(#paper)" stroke="white" stroke-width="2"/>
<text x="19" y="13" fill="#438BC4" font-family="Arial,sans-serif" font-size="12" font-weight="700">XLS / PDF</text><path opacity="0" d="M19 11H85" stroke="#83B8C8" stroke-width="5" stroke-linecap="round"/>
<path d="M18 38H139M18 61H139M18 84H139M59 28V90M103 28V90" stroke="#91C5D5" stroke-width="2"/>
<circle cx="150" cy="77" r="28" fill="url(#aqua)" stroke="#FFF9DE" stroke-width="2"/>
<path d="M136 77L146 87L165 66" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(86 589)" filter="url(#depth)">
<ellipse cy="8" rx="44" ry="43" fill="#62AAC3"/>
<circle r="43" fill="url(#paper)" stroke="white" stroke-width="2"/>
<path d="M0 0V-43A43 43 0 0 1 41 13Z" fill="url(#sky)"/>
<path d="M0 0L41 13A43 43 0 0 1 -30 31Z" fill="url(#aqua)"/>
<circle r="18" fill="#FFF9DF" stroke="white"/>
</g>
<!-- Secondary charts remain subdued beneath the right-hand screenshot. -->
<g transform="translate(1147 98) rotate(12)" opacity=".25">
<rect x="10" y="10" width="178" height="169" rx="20" fill="#69B3D0"/>
<rect width="178" height="169" rx="20" fill="url(#paper)" stroke="white" stroke-width="2"/>
<path d="M24 34H115M24 132H153" stroke="#68A8C0" stroke-width="5" stroke-linecap="round"/>
<path d="M28 113L61 87L90 99L122 66L150 50" stroke="#4BAFC2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(795 239)" opacity=".17">
<rect width="134" height="145" rx="18" fill="url(#sky)"/>
<path d="M25 37H105M25 65H94M25 93H103" stroke="white" stroke-width="7" stroke-linecap="round"/>
</g>
<style>
  .reports-flow-line {
    /* A full-path gap lets the entire stroke exit before the next one enters. */
    stroke-dasharray: 100 100;
    opacity: .9;
  }
  @media (prefers-reduced-motion: reduce) {
    .reports-flow-line { animation: none; stroke-dasharray: none; }
    .reports-flow-dot { display: none; }
  }
</style>
</svg>