<!-- First-frame filing route: coloured dashes travel left to right. -->
<style>
  path[d^="M994 597H1090"] {
    stroke: #9461cf;
    stroke-width: 2.5;
    stroke-linecap: round;
    opacity: .9;
    animation: gstReturnsDashTrain 1.2s linear infinite;
  }
  @keyframes gstReturnsDashTrain {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -24; }
  }
  @media (prefers-reduced-motion: reduce) {
    path[d^="M994 597H1090"] { animation: none; }
  }
</style>
