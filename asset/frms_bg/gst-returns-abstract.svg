<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" fill="none">
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDF8E6"/></linearGradient>
<linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DEB9FF"/><stop offset="1" stop-color="#AC79D8"/></linearGradient>
<linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9AEECB"/><stop offset="1" stop-color="#43B98C"/></linearGradient>
<filter id="depth" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#6C4688" flood-opacity=".22"/></filter>
</defs>
<!-- Primary motifs sit in exposed desktop corners; the copy area stays quiet. -->
<g transform="translate(1300 -22) rotate(12 76 75)" filter="url(#depth)">
<rect x="8" y="10" width="150" height="160" rx="20" fill="#A97CC9"/>
<rect width="150" height="160" rx="20" fill="url(#paper)" stroke="white" stroke-width="2"/>
<path d="M20 0H130Q150 0 150 20V46H0V20Q0 0 20 0Z" fill="url(#purple)"/>
<path d="M36 -5V16M114 -5V16" stroke="#84609E" stroke-width="9" stroke-linecap="round"/>
<g fill="#CBEBD7"><rect x="20" y="64" width="26" height="24" rx="5"/><rect x="62" y="64" width="26" height="24" rx="5"/><rect x="104" y="64" width="26" height="24" rx="5"/><rect x="20" y="106" width="26" height="24" rx="5"/><rect x="104" y="106" width="26" height="24" rx="5"/></g>
<rect x="58" y="101" width="34" height="34" rx="8" fill="url(#mint)"/>
<path d="M66 118L73 125L85 111" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- Continuous flow starts beneath the document and finishes beneath the check tile. -->
<path class="returns-flow-line"
  d="M880 585 C946 595 1017 602 1055 568 C1082 541 1112 545 1138 571 C1164 597 1192 607 1223 595 C1254 583 1290 570 1346 578"
  pathLength="100" fill="none" stroke="#9461cf" stroke-width="3"
  stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
<g transform="translate(743 540) rotate(-13 92 62)" filter="url(#depth)">
<rect x="20" y="0" width="150" height="105" rx="14" fill="#B68ED2"/>
<rect x="10" y="-9" width="150" height="105" rx="14" fill="#E4C9F7" stroke="white"/>
<rect y="-18" width="150" height="105" rx="14" fill="url(#paper)" stroke="white" stroke-width="2"/>
<path d="M20 5H78M20 24H111M20 43H92" stroke="#9CB9AD" stroke-width="5" stroke-linecap="round"/>
<circle cx="131" cy="59" r="28" fill="url(#mint)" stroke="#D5FFEB" stroke-width="2"/>
<path d="M117 59L127 69L146 48" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(1312 550)" filter="url(#depth)">
<rect width="62" height="58" rx="15" fill="url(#purple)" stroke="#F8EFFF"/>
<path d="M17 29L27 39L46 19" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- Secondary motifs behind the dashboard screenshot. -->
<g transform="translate(40 72) rotate(-12)" opacity=".3">
<rect x="9" y="10" width="157" height="183" rx="18" fill="#AC83CD"/>
<rect width="157" height="183" rx="18" fill="url(#paper)" stroke="white" stroke-width="2"/>
<path d="M26 40H115M26 70H131M26 100H105M26 130H119" stroke="#AC83CD" stroke-width="7" stroke-linecap="round"/>
</g>
<g transform="translate(555 195)" opacity=".19">
<rect width="130" height="140" rx="18" fill="url(#purple)"/>
<path d="M26 45H103M26 70H90M26 95H100" stroke="white" stroke-width="7" stroke-linecap="round"/>
</g>


<style>
  .returns-flow-line {
    /* One long stroke and a short travelling gap: never a blank route. */
    stroke-dasharray: 100 24;
    stroke-dashoffset: 0;
    opacity: .9;
    animation: returnsContinuousFlow 7s linear infinite;
  }
  @keyframes returnsContinuousFlow {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -124; }
  }
  @media (prefers-reduced-motion: reduce) {
    .returns-flow-line { animation: none; stroke-dasharray: none; }
  }
</style>
</svg>