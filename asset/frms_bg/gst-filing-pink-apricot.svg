<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" fill="none">
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF0F3"/></linearGradient>
 <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#E99BB8"/><stop offset="1" stop-color="#C65C82"/></linearGradient>
 <linearGradient id="amber" x2="1" y2="1"><stop stop-color="#FFD4B6"/><stop offset="1" stop-color="#E5A786"/></linearGradient>
 <filter id="depth" x="-40%" y="-40%" width="190%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#9B5972" flood-opacity=".23"/></filter>
<linearGradient id="filing-flow-colors" x1="0%" y1="50%" x2="100%" y2="50%" color-interpolation="sRGB"><stop stop-color="#C65C82"/><stop offset="1" stop-color="#C65C82"/></linearGradient>
</defs>
<!-- Continuous flow starts beneath the document and finishes beneath the check tile. -->
<path class="filing-flow-line"
  d="M187 580 C360 610 460 541 620 577 S870 608 1020 575 S1230 550 1358 573"
  pathLength="100" fill="none" stroke="url(#filing-flow-colors)" stroke-width="3"
  stroke-linecap="round" stroke-linejoin="round" pointer-events="none" stroke-dashoffset="100">
  <!-- Use the SVG document clock shared by the dot, including after tab suspension. -->
  <animate attributeName="stroke-dashoffset" values="100;-100" begin="0s"
    dur="14s" calcMode="linear" repeatCount="indefinite"/>
</path>
<!-- Recording-style pulsing dot follows the leading tip on the existing timeline. -->
<g class="filing-flow-dot" pointer-events="none">
  <g>
    <circle r="7" fill="#C65C82" opacity=".2">
      <animate attributeName="fill" values="#C65C82;#C65C82;#C65C82" keyTimes="0;0.5;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;10;5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.06;.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#C65C82">
      <animate attributeName="fill" values="#C65C82;#C65C82;#C65C82" keyTimes="0;0.5;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <animateMotion begin="0s" path="M187 580 C360 610 460 541 620 577 S870 608 1020 575 S1230 550 1358 573" dur="14s" repeatCount="indefinite"
      calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.5;1"/>
  </g>
  <animate attributeName="opacity" values="0.95;0;0" keyTimes="0;0.5;1"
    calcMode="discrete" dur="14s" repeatCount="indefinite"/>
</g>


<!-- Calendar at the top right. -->
<g transform="translate(1287 -16) rotate(10 65 70)" filter="url(#depth)">
<rect x="8" y="10" width="139" height="148" rx="17" fill="#D699B1"/>
<rect width="139" height="148" rx="17" fill="url(#paper)" stroke="white" stroke-width="2"/>
<path d="M17 0h105a17 17 0 0 1 17 17v29H0V17A17 17 0 0 1 17 0Z" fill="#EBA9BF"/>
<path d="M33-5v22M106-5v22" stroke="#B56686" stroke-width="7" stroke-linecap="round"/>
<g fill="#F2D1DC"><rect x="19" y="64" width="24" height="23" rx="5"/><rect x="58" y="64" width="24" height="23" rx="5"/><rect x="97" y="64" width="24" height="23" rx="5"/><rect x="19" y="104" width="24" height="23" rx="5"/></g>
<rect x="57" y="100" width="33" height="33" rx="7" fill="#C65C82"/><path d="m64 115 6 6 13-15" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- Filed receipt stack at the bottom left. -->
<g transform="translate(36 531) rotate(-9 85 45)" filter="url(#depth)">
<rect x="14" y="12" width="169" height="95" rx="12" fill="#CE8FAA"/>
<rect x="7" y="4" width="169" height="95" rx="12" fill="#F6D1DF" stroke="white"/>
<rect width="169" height="95" rx="12" fill="url(#paper)" stroke="white" stroke-width="2"/>
<text x="17" y="27" fill="#A95374" font-family="Arial,sans-serif" font-size="13" font-weight="700">ARN RECEIPT</text>
<path d="M17 44h94M17 59h66M17 75h78" stroke="#CDABBA" stroke-width="5" stroke-linecap="round"/>
<circle cx="144" cy="63" r="22" fill="#C65C82"/><path d="m133 62 8 8 15-17" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g transform="translate(1326 541)" filter="url(#depth)"><rect x="4" y="7" width="64" height="64" rx="19" fill="#AB4E70"/><rect width="64" height="64" rx="19" fill="url(#teal)" stroke="#FFE9F0" stroke-width="2"/><path d="m17 32 11 11 21-23" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Quiet dealer rows and timeline behind the screenshot on the left. -->
<g transform="translate(32 80) rotate(-12)" opacity=".28"><rect x="8" y="10" width="179" height="163" rx="18" fill="#D49BAB"/><rect width="179" height="163" rx="18" fill="url(#paper)" stroke="white" stroke-width="2"/><path d="M25 32h125M25 64h88M25 97h88M25 130h88" stroke="#C398A6" stroke-width="6" stroke-linecap="round"/><g fill="#CF7898"><circle cx="145" cy="64" r="9"/><circle cx="145" cy="97" r="9"/></g><circle cx="145" cy="130" r="9" fill="#E5A786"/></g>
<g transform="translate(552 225)" opacity=".18"><rect width="118" height="120" rx="18" fill="url(#teal)"/><path d="M24 33h70M24 59h48M24 85h62" stroke="white" stroke-width="6" stroke-linecap="round"/></g>
<style>
  .filing-flow-line {
    /* A full-path gap lets the entire stroke exit before the next one enters. */
    stroke-dasharray: 100 100;
    opacity: .9;
  }
  @media (prefers-reduced-motion: reduce) {
    .filing-flow-line { animation: none; stroke-dasharray: none; }
    .filing-flow-dot { display: none; }
  }
</style>
</svg>
